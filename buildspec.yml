version: 0.2

env:
  variables:
    AWS_REGION: "eu-north-1"
    EKS_CLUSTER_NAME: "pdf-app-cluster"
    BACKEND_REPO: "pdf-backend"
    FRONTEND_REPO: "pdf-frontend"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing kubectl binary command line utility..."
      # FIXED: Downloads the actual native compiled binary utility tool for Linux architectures
      - curl -fsSL "https://k8s.io" -o kubectl
      - chmod +x kubectl
      - mv kubectl /usr/local/bin/
      - yum update -y
      - yum install -y gettext

  pre_build:
    commands:
      - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - export IMAGE_TAG_SHORT=${COMMIT_HASH:-latest}
      - export REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
      - aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

  build:
    commands:
      - echo "Building backend image..."
      - docker build -f Dockerfile -t "$REGISTRY/$BACKEND_REPO:$IMAGE_TAG_SHORT" .
      - docker tag "$REGISTRY/$BACKEND_REPO:$IMAGE_TAG_SHORT" "$REGISTRY/$BACKEND_REPO:latest"

      - echo "Building frontend image..."
      - docker build -f frontend.Dockerfile -t "$REGISTRY/$FRONTEND_REPO:$IMAGE_TAG_SHORT" .
      - docker tag "$REGISTRY/$FRONTEND_REPO:$IMAGE_TAG_SHORT" "$REGISTRY/$FRONTEND_REPO:latest"

      - echo "Pushing container images to ECR..."
      - docker push "$REGISTRY/$BACKEND_REPO:$IMAGE_TAG_SHORT"
      - docker push "$REGISTRY/$BACKEND_REPO:latest"
      - docker push "$REGISTRY/$FRONTEND_REPO:$IMAGE_TAG_SHORT"
      - docker push "$REGISTRY/$FRONTEND_REPO:latest"

      - echo "Updating Kubernetes deployment manifest with explicit targets..."
      # FIXED: Targets repository path strings directly to prevent silent parsing failures
      - sed -i "s|image:.*$BACKEND_REPO.*|image:\ $REGISTRY\/$BACKEND_REPO:$IMAGE_TAG_SHORT|g" app-deployment.yaml
      - sed -i "s|image:.*$FRONTEND_REPO.*|image:\ $REGISTRY\/$FRONTEND_REPO:$IMAGE_TAG_SHORT|g" app-deployment.yaml
      
      - echo "Applying updated manifests to EKS cluster..."
      - kubectl apply -f app-deployment.yaml

artifacts:
  files:
    - app-deployment.yaml
